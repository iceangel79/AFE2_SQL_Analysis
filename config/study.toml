# Studienkonfiguration AFE2
# Alle methodischen Entscheidungen der Auswertung stehen hier (oder in den
# CSV-Dateien in diesem Ordner) und nicht im Code. Jede Änderung wird über Git
# nachvollziehbar und kann im Methodenteil der Arbeit zitiert werden.

[sample]
# Erster und letzter Tag der Feldphase (ISO-Datum, inklusive, Lokalzeit gemäss timezone).
# Leer = keine Datumsgrenze (die Pipeline warnt dann).
# Feldstart 26.10.2026 (Versand der Einladungen); alles davor sind Alpha-/Beta-Tests.
field_start = "2026-10-26"
field_end = ""
timezone = "Europe/Zurich"
# Späterer gültiger Start pro Variante. Am 26.10.2026 zeichnete Matomo in der
# Menüversion jeweils nur die erste Seite auf (Tracking-Problem, am 27.10. behoben).
# Daher zählen ML-Besuche erst ab 27.10.; Onepager-Daten sind ab 26.10. gültig.
variant_start = { ML = "2026-10-27" }
# Zusätzlich ausgeschlossene Besuche (Tests, Abbrüche usw.) mit Begründung
exclude_visits_file = "config/exclude_visits.csv"
# Nur diese Gerätetypen auswerten (Matomo device_type: 1 = Desktop, 2 = Tablet, 3 = Smartphone).
# Leer = alle Geräte.
device_types = [1]
# Besuche mit sichtbarer WordPress-Adminleiste ausschliessen (eingeloggte Admins = Tests)
exclude_admin_bar = true
# Nur Besuche auswerten, die das Formular erreicht haben (erste Eingabe im Fragebogen).
# Teamentscheid 27.10.2026: ja. Sonst vergleicht man Abbrüche (v. a. Menüversion) mit
# vollständigen Durchläufen, was die Maus-Kennzahlen verzerrt.
require_form = true
# Mindestdauer eines Besuchs in Sekunden (0 = keine Grenze), filtert Kurzbesuche/Abbrüche
min_total_s = 0

[questionnaire]
# Alle Skalen im WPForms-Fragebogen sind 5-stufig (UEQ-S-Items und Schwierigkeit).
# Abweichung vom Original-UEQ-S (7-stufig): Werte sind nicht mit den UEQ-Benchmarks vergleichbar.
scale_min = 1
scale_max = 5
# WPForms-Formular-ID -> Variante ("Fragebogen (ML)" = 79, "Fragebogen (OP)" = 118)
form_ids = { "79" = "ML", "118" = "OP" }
# Zuordnung Formulareintrag -> Matomo-Besuch: Der Eintrag gehört zum Besuch derselben
# Variante, dessen letzte Formulareingabe zeitlich am nächsten vor dem Absenden liegt.
# Maximal erlaubter Abstand zwischen letzter Eingabe und Absenden (Sekunden):
match_tolerance_s = 600
# Manuelle Korrekturen der Zuordnung (entry_id -> idvisit), mit Begründung
match_overrides_file = "config/match_overrides.csv"
# Einzelne Formulareinträge ausschliessen (z. B. Tests), mit Begründung
exclude_entries_file = "config/exclude_entries.csv"
# Hinweis: variant_start gilt nur für die Maus-Aufzeichnung. Fragebogen der Menüversion
# vom 26.10. sind gültig (das Formular funktionierte) und zählen für H3a/H3b.

# Bewertung der Freitextantworten: Antwort gilt als richtig, wenn sie (ohne Gross-/
# Kleinschreibung) mindestens einen Begriff enthält. Quelle: Texte der Website.
# a1: "Aufgewachsen bin ich im Prättigau"; Schiers liegt im Prättigau und wird im
#     Einleitungstext als Wohnort der Familie genannt -> beide gelten als richtig
#     (Teamentscheid 27.10.2026).
# a2: "mit meinem Trainer Andrin Flury"
# a3: "Gipfelgold Sporternährung"
[questionnaire.answers]
a1 = ["prättigau", "schiers"]
a2 = ["andrin", "flury"]
a3 = ["gipfelgold"]

[variants]
# Zuordnung eines Besuchs zur Variante anhand der URLs seiner Seitenaufrufe
op_url_contains = "one-pager"
# Kontaktseite mit dem Fragebogen (Ende der Aufgabe, "Time-to-Form")
form_url_contains = "kontakt"

[metrics]
# Matomo speichert x/y relativ zum Element unter der Maus, skaliert auf 0..2000.
# Mindestbewegung (in Element-Einheiten), damit ein Richtungswechsel zählt (filtert Zittern)
direction_min_delta = 20
# Sensitivitätsanalyse: dieselbe Kennzahl mit diesen Schwellen (Tabelle im Bericht).
# Eine Umrechnung in Pixel ist nicht möglich: Der DOM-Snapshot enthält Masse nur für
# einzelne Bilder; die Grösse der übrigen Elemente entsteht erst beim Rendern im Browser.
# Bei einem 600 px breiten Element entsprechen 20 Einheiten etwa 6 px (20/2000 * 600).
direction_sensitivity = [10, 20, 40]
# Lücke zwischen zwei Mausereignissen, ab der eine Pause (Zögern) gezählt wird (ms)
pause_ms = 1000
# Obergrenze, mit der eine Lücke höchstens zur AOI-Verweildauer beiträgt (ms).
# Verhindert, dass ruhende Maus (z. B. beim Lesen) ohne Ende als Verweildauer zählt.
dwell_cap_ms = 3000

[images]
# Inhaltsbilder (Bildname ohne Grösse/Endung). Platzhalter und Ladesymbole fallen weg.
# Auf beiden Varianten dieselben 8 Bilder (Abgleich DOM-Snapshot und Live-Seite 27.10.2026):
# Titelbild, Portrait, Podest, Rennszene, Training, Werkstatt, Sponsorenabend, Strandbild.
# Alle sind auf die Grossansicht verlinkt (Lightbox).
content_regex = "-Mira-Caduff$"

# Areas of Interest (AOI): Ein Mausereignis liegt in der AOI, wenn alle angegebenen
# Regeln zutreffen: url_regex (Seiten-URL), selector_regex (CSS-Selektor) und/oder
# image_regex (Bild unter der Maus, über den DOM-Snapshot bestimmt). Leer = egal.
# Prüfen mit:  afe.bat images
[[aoi]]
name = "portrait"
description = "Porträt von Mira (Startseite Menüversion und Onepager)"
image_regex = "^Portrait-Mira-Caduff$"
